<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

            <div class="input-group">

                <label for="password">KATA SANDI</label>
            </div>

                </button>
                <button class="social-btn btn-xbox">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.63 17.65c-1.39-1.95-3.52-4.03-5.63-4.03-2.11 0-4.24 2.08-5.63 4.03a9.75 9.75 0 0 1-1.83-2.22c2.4-1.87 5.05-3.4 7.46-3.4s5.06 1.53 7.46 3.4a9.75 9.75 0 0 1-1.83 2.22zM12 11.23c-1.8 0-4.01-1.33-6.04-3.55a9.78 9.78 0 0 1 1.63-2.6c1.61 2.37 3.24 3.65 4.41 3.65 1.17 0 2.8-1.28 4.41-3.65a9.78 9.78 0 0 1 1.63 2.6c-2.03 2.22-4.24 3.55-6.04 3.55z" />

                </button>
                <button class="social-btn btn-playstation">

                    </svg>

            </div>

            <div class="stay-signed-in">
                <input type="checkbox" id="stay-signed-in" checked>
                <label for="stay-signed-in">Tetap sign in</label>
            </div>

            <button class="submit-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <div class="footer-links">
            <a href="#">TIDAK BISA SIGN IN?</a>
